<svg xmlns="http://www.w3.org/2000/svg" width="120" height="120" viewBox="0 0 120 120">
  <defs>
    <!-- 与打包标 build/icon.svg 同一枚银白 π 字标：官网 favicon / 顶栏 logo 保持品牌一致。 -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#161719"/>
      <stop offset="0.58" stop-color="#050506"/>
      <stop offset="1" stop-color="#000000"/>
    </linearGradient>
    <linearGradient id="logo" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop stop-color="#ffffff"/>
      <stop offset="0.48" stop-color="#f4f4f5"/>
      <stop offset="1" stop-color="#a7a8ab"/>
    </linearGradient>
    <linearGradient id="shine" x1="0.3" y1="0" x2="0.7" y2="1">
      <stop stop-color="#ffffff" stop-opacity="0.18" offset="0"/>
      <stop stop-color="#ffffff" stop-opacity="0" offset="0.52"/>
    </linearGradient>
  </defs>
  <rect width="120" height="120" rx="26" fill="url(#bg)"/>
  <rect width="120" height="58" rx="26" fill="url(#shine)"/>
  <!-- π 字标原始 bbox 165.29–634.72，中心约 (400,400)；按 0.1619 缩放后宽约 76px，平移居中于 120×120。 -->
  <g fill="url(#logo)" transform="translate(-4.76, -4.76) scale(0.1619)">
    <path fill-rule="evenodd" d="M165.29 165.29H517.36V400H400V517.36H282.65V634.72H165.29ZM282.65 282.65V400H400V282.65Z"/>
    <path d="M517.36 400H634.72V634.72H517.36Z"/>
  </g>
</svg>
