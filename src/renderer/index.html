<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' file: data: blob: pideck-bg: pideck-pet: https://cloudcache.tencent-cloud.com https://skillhub-1388575217.cos.accelerate.myqcloud.com; font-src 'self' data:; frame-src 'self' file: blob:; connect-src 'self' ws://127.0.0.1:* ws://localhost:* http://127.0.0.1:* http://localhost:* https://api.skillhub.cn"
    />
    <title></title>
    <style>
      /* 启动画面：独立于 #root，React 挂载后淡出移除；不依赖外部字体/图片，保证首帧极快。 */
      /* 注意：reset 必须限定在 boot-overlay 内——全局 * 规则是无层级的，
         会压过 Tailwind @layer utilities 的所有间距工具类（#115 曾因此导致菜单/弹窗无内边距）。 */
      #boot-overlay, #boot-overlay * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        height: 100%;
        overflow: hidden;
        background: #eef0f3;
      }

      #boot-overlay {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        background:
          radial-gradient(1200px 600px at 50% 28%, rgba(15, 23, 42, 0.06), transparent 62%),
          linear-gradient(180deg, #f7f8f5 0%, #f1f3ef 55%, #ecefeb 100%);
        transition: opacity 420ms cubic-bezier(0.22, 1, 0.36, 1), transform 420ms cubic-bezier(0.22, 1, 0.36, 1);
        will-change: opacity, transform;
      }
      #boot-overlay.fade-out {
        opacity: 0;
        transform: scale(1.02);
        pointer-events: none;
      }

      .boot-brand {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 14px;
        animation: boot-rise 520ms cubic-bezier(0.22, 1, 0.36, 1) both;
      }

      .boot-logo {
        position: relative;
        width: 88px;
        height: 88px;
        display: grid;
        place-items: center;
        border-radius: 22px;
        /* 与 build/icon.svg 品牌图标同一套黑渐变，保证启动画面与任务栏图标一致 */
        background: linear-gradient(145deg, #1c1c1e, #000000);
        box-shadow:
          0 1px 0 rgba(255, 255, 255, 0.18) inset,
          0 14px 32px rgba(15, 23, 42, 0.28),
          0 2px 8px rgba(15, 23, 42, 0.08);
      }
      .boot-logo::after {
        content: "";
        position: absolute;
        inset: -10px;
        border-radius: 28px;
        border: 1px solid rgba(15, 23, 42, 0.14);
        animation: boot-ring 1.8s ease-out infinite;
        pointer-events: none;
      }
      .boot-logo svg {
        width: 48px;
        height: 48px;
      }

      .boot-title {
        color: #1f2937;
        font-size: 20px;
        font-weight: 650;
        letter-spacing: 0.01em;
        font-family: system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
        line-height: 1.2;
      }
      .boot-subtitle {
        color: #6b7280;
        font-size: 13px;
        font-weight: 500;
        letter-spacing: 0.02em;
        font-family: system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
        line-height: 1.3;
      }

      .boot-progress {
        width: 120px;
        height: 3px;
        border-radius: 999px;
        background: rgba(15, 23, 42, 0.08);
        overflow: hidden;
        animation: boot-rise 520ms cubic-bezier(0.22, 1, 0.36, 1) 80ms both;
      }
      .boot-progress-bar {
        width: 42%;
        height: 100%;
        border-radius: inherit;
        background: linear-gradient(90deg, #3f3f46, #18181b);
        animation: boot-progress 1.15s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }

      @keyframes boot-rise {
        from {
          opacity: 0;
          transform: translateY(10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      @keyframes boot-ring {
        0% {
          opacity: 0.55;
          transform: scale(0.92);
        }
        70% {
          opacity: 0;
          transform: scale(1.08);
        }
        100% {
          opacity: 0;
          transform: scale(1.08);
        }
      }
      @keyframes boot-progress {
        0% {
          transform: translateX(-120%);
        }
        100% {
          transform: translateX(280%);
        }
      }

      @media (prefers-color-scheme: dark) {
        html, body {
          background: #111315;
        }
        #boot-overlay {
          background:
            radial-gradient(1000px 520px at 50% 30%, rgba(255, 255, 255, 0.05), transparent 60%),
            linear-gradient(180deg, #15181b 0%, #111315 100%);
        }
        .boot-title {
          color: #f3f4f6;
        }
        .boot-subtitle {
          color: #9ca3af;
        }
        .boot-progress {
          background: rgba(255, 255, 255, 0.08);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .boot-brand,
        .boot-progress,
        .boot-logo::after,
        .boot-progress-bar {
          animation: none !important;
        }
        #boot-overlay {
          transition-duration: 120ms;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <!-- 启动画面覆盖层：React 挂载后通过 fade-out 动画淡出再移除 -->
    <div id="boot-overlay">
      <div class="boot-brand">
        <div class="boot-logo">
          <!-- 品牌跳蛛（与 build/icon.svg 同一图形）：银灰身体 + 深色大眼睛，小尺寸下仍可辨 -->
          <svg viewBox="0 0 32 32" aria-hidden="true">
            <defs>
              <linearGradient id="boot-logo-silver" x1="0.2" y1="0" x2="0.8" y2="1">
                <stop stop-color="#e6e6e9"/>
                <stop offset="0.5" stop-color="#c9c9ce"/>
                <stop offset="1" stop-color="#8f8f96"/>
              </linearGradient>
            </defs>
            <g stroke="url(#boot-logo-silver)" stroke-width="1.5" stroke-linecap="round" fill="none">
              <path d="M7.5 15.5C3.5 14 1.5 11 2 7"/>
              <path d="M6.5 17.5C2.5 16.5 0.5 15 0.5 12"/>
              <path d="M6.5 20C3 20 1 21 1 23.5"/>
              <path d="M7.5 22C4.5 23 3.5 25 4.5 27.5"/>
              <path d="M24.5 15.5C28.5 14 30.5 11 30 7"/>
              <path d="M25.5 17.5C29.5 16.5 31.5 15 31.5 12"/>
              <path d="M25.5 20C29 20 31 21 31 23.5"/>
              <path d="M24.5 22C27.5 23 28.5 25 27.5 27.5"/>
              <path d="M12 14.5C10 16.5 9 18.5 10 20"/>
              <path d="M20 14.5C22 16.5 23 18.5 22 20"/>
            </g>
            <ellipse cx="16" cy="22.5" rx="7" ry="7.5" fill="url(#boot-logo-silver)"/>
            <circle cx="16" cy="10" r="6.8" fill="url(#boot-logo-silver)"/>
            <circle cx="12.3" cy="9" r="1.6" fill="#0a0a0b"/>
            <circle cx="19.7" cy="9" r="1.6" fill="#0a0a0b"/>
          </svg>
        </div>
        <strong class="boot-title">phids</strong>
        <span class="boot-subtitle">正在启动工作台…</span>
      </div>
      <div class="boot-progress" aria-hidden="true">
        <div class="boot-progress-bar"></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
