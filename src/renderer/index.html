<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' file: data: blob: pideck-bg: pideck-pet: https://cloudcache.tencent-cloud.com https://skillhub-1388575217.cos.accelerate.myqcloud.com; font-src 'self' data:; frame-src 'self' file: blob:; connect-src 'self' ws://127.0.0.1:* ws://localhost:* http://127.0.0.1:* http://localhost:* https://api.skillhub.cn"
    />
    <title></title>
    <style>
      /* 启动画面：独立于 #root，React 挂载后淡出移除；不依赖外部字体/图片，保证首帧极快。 */
      /* 注意：reset 必须限定在 boot-overlay 内——全局 * 规则是无层级的，
         会压过 Tailwind @layer utilities 的所有间距工具类（#115 曾因此导致菜单/弹窗无内边距）。 */
      #boot-overlay, #boot-overlay * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        height: 100%;
        overflow: hidden;
        background: #eef0f3;
      }

      #boot-overlay {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 22px;
        background:
          radial-gradient(1200px 600px at 50% 28%, rgba(15, 23, 42, 0.06), transparent 62%),
          linear-gradient(180deg, #f7f8f5 0%, #f1f3ef 55%, #ecefeb 100%);
        transition: opacity 420ms cubic-bezier(0.22, 1, 0.36, 1), transform 420ms cubic-bezier(0.22, 1, 0.36, 1);
        will-change: opacity, transform;
      }
      #boot-overlay.fade-out {
        opacity: 0;
        transform: scale(1.02);
        pointer-events: none;
      }

      .boot-brand {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 18px;
        animation: boot-rise 520ms cubic-bezier(0.22, 1, 0.36, 1) both;
      }

      .boot-logo {
        position: relative;
        width: 120px;
        height: 120px;
        display: grid;
        place-items: center;
        /* SVG 已铺满圆角方，外层只留光晕，不再叠第二层黑底。 */
        background: transparent;
        box-shadow: 0 18px 40px rgba(15, 23, 42, 0.3);
      }
      .boot-logo::after {
        content: "";
        position: absolute;
        inset: -12px;
        border-radius: 34px;
        border: 1px solid rgba(15, 23, 42, 0.14);
        animation: boot-ring 1.8s ease-out infinite;
        pointer-events: none;
      }
      .boot-logo svg {
        width: 120px;
        height: 120px;
        display: block;
      }

      .boot-title {
        color: #111827;
        font-size: 40px;
        font-weight: 720;
        letter-spacing: 0.06em;
        font-family: system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
        line-height: 1.1;
      }
      .boot-subtitle {
        color: #4b5563;
        font-size: 16px;
        font-weight: 500;
        letter-spacing: 0.04em;
        font-family: system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
        line-height: 1.35;
      }

      .boot-progress {
        width: 120px;
        height: 3px;
        border-radius: 999px;
        background: rgba(15, 23, 42, 0.08);
        overflow: hidden;
        animation: boot-rise 520ms cubic-bezier(0.22, 1, 0.36, 1) 80ms both;
      }
      .boot-progress-bar {
        width: 42%;
        height: 100%;
        border-radius: inherit;
        background: linear-gradient(90deg, #3f3f46, #18181b);
        animation: boot-progress 1.15s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }

      @keyframes boot-rise {
        from {
          opacity: 0;
          transform: translateY(10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      @keyframes boot-ring {
        0% {
          opacity: 0.55;
          transform: scale(0.92);
        }
        70% {
          opacity: 0;
          transform: scale(1.08);
        }
        100% {
          opacity: 0;
          transform: scale(1.08);
        }
      }
      @keyframes boot-progress {
        0% {
          transform: translateX(-120%);
        }
        100% {
          transform: translateX(280%);
        }
      }

      @media (prefers-color-scheme: dark) {
        html, body {
          background: #111315;
        }
        #boot-overlay {
          background:
            radial-gradient(1000px 520px at 50% 30%, rgba(255, 255, 255, 0.05), transparent 60%),
            linear-gradient(180deg, #15181b 0%, #111315 100%);
        }
        .boot-title {
          color: #f3f4f6;
        }
        .boot-subtitle {
          color: #9ca3af;
        }
        .boot-progress {
          background: rgba(255, 255, 255, 0.08);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .boot-brand,
        .boot-progress,
        .boot-logo::after,
        .boot-progress-bar {
          animation: none !important;
        }
        #boot-overlay {
          transition-duration: 120ms;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <!-- 启动画面覆盖层：React 挂载后通过 fade-out 动画淡出再移除 -->
    <div id="boot-overlay">
      <div class="boot-brand">
        <div class="boot-logo">
          <!-- 铺满圆角方的几何跳蛛，避免 PNG 透明边漏白；字标放在图标外放大 -->
          <svg viewBox="0 0 120 120" width="120" height="120" aria-hidden="true">
            <defs>
              <linearGradient id="boot-mark-bg" x1="0" y1="0" x2="1" y2="1">
                <stop stop-color="#161719" />
                <stop offset="0.58" stop-color="#050506" />
                <stop offset="1" stop-color="#000000" />
              </linearGradient>
              <linearGradient id="boot-mark-shine" x1="0.3" y1="0" x2="0.7" y2="1">
                <stop stop-color="#ffffff" stop-opacity="0.16" />
                <stop offset="0.55" stop-color="#ffffff" stop-opacity="0" />
              </linearGradient>
            </defs>
            <rect width="120" height="120" rx="26" fill="url(#boot-mark-bg)" />
            <rect width="120" height="58" rx="26" fill="url(#boot-mark-shine)" />
            <g fill="#f4f4f5">
              <ellipse cx="60" cy="50" rx="17" ry="15" />
              <ellipse cx="60" cy="72" rx="11" ry="13" />
              <path d="M47 40 24 16 34 14 54 38Z" />
              <path d="M43 48 12 34 20 28 46 46Z" />
              <path d="M43 60 12 76 20 82 46 62Z" />
              <path d="M49 70 28 98 38 100 56 72Z" />
              <path d="M73 40 96 16 86 14 66 38Z" />
              <path d="M77 48 108 34 100 28 74 46Z" />
              <path d="M77 60 108 76 100 82 74 62Z" />
              <path d="M71 70 92 98 82 100 64 72Z" />
            </g>
          </svg>
        </div>
        <strong class="boot-title">phids</strong>
        <span class="boot-subtitle">正在启动工作台…</span>
      </div>
      <div class="boot-progress" aria-hidden="true">
        <div class="boot-progress-bar"></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
