# AI 协助：@claude 提及应答 + 新 PR 自动评审。
#
# 只做「评论」，不做合并 —— PR 落地仍走 branch protection + auto-merge（见 docs/ai-assist.md）。
#
# 安全约束（改之前先读 docs/ai-assist.md「安全边界」）：
# 1. 绝不用 pull_request_target：公开仓库的 fork PR 会同时拿到写权限 token 与仓库 secrets。
#    这里用 pull_request —— 同仓分支才有 secrets，fork PR 拿不到，下面的 step 判据自然跳过。
# 2. issue_comment 在公开仓库谁都能发，只认 OWNER/MEMBER/COLLABORATOR 的 @claude。
# 3. 未配置 ANTHROPIC_API_KEY 时整条 workflow 静默跳过：不会失败、不会刷红叉。
name: AI Assist

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request:
    types: [opened, ready_for_review]

# 同一 issue/PR 串行：两个提问同时跑会互相覆盖上下文，也会重复烧 token
concurrency:
  group: ai-assist-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

permissions:
  contents: read
  issues: write
  pull-requests: write
  actions: read

jobs:
  # ── 1. @claude 提及应答：issue / PR 正文或评论里 @claude 即触发 ──
  assist:
    if: |
      github.event_name != 'pull_request' &&
      contains(github.event.comment.body || github.event.issue.body || '', '@claude') &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association || github.event.issue.author_association)
    runs-on: ubuntu-latest
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - name: 未配置 API key
        if: env.ANTHROPIC_API_KEY == ''
        run: echo "::notice::未配置 ANTHROPIC_API_KEY，AI 协助已跳过（配置方法见 docs/ai-assist.md）"
      - name: Claude
        if: env.ANTHROPIC_API_KEY != ''
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ env.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          track_progress: true
          claude_args: |
            --max-turns 6
          prompt: |
            你在 PiDeck（Electron + React 桌面应用）仓库里响应 @claude 提问。

            先读 AGENTS.md，再按它路由到的 docs/ 取对应规则；回答必须遵守 AGENTS.md 的铁律
            （不自动提交、不加第二条 pi↔PiDeck 通道、新 IPC 三处同步、改 zh-CN 词典要重跑
            scripts/genZhTwCopy.mjs、禁止全量 npm run build 等）。

            行为约束：
            - 只在 issue/PR 里回评论，不 push、不开 PR、不合并。
            - 需要证据的结论必须给出 文件:行；读不到就说明读不到，不猜。
            - 中文回答，先给结论再给依据，不写客套话。

  # ── 2. 新 PR 自动评审：只读代码，产出可执行的评审意见 ──
  review:
    if: |
      github.event_name == 'pull_request' &&
      github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - name: 未配置 API key
        if: env.ANTHROPIC_API_KEY == ''
        run: echo "::notice::未配置 ANTHROPIC_API_KEY，自动评审已跳过（配置方法见 docs/ai-assist.md）"
      - uses: actions/checkout@v4
        if: env.ANTHROPIC_API_KEY != ''
        with:
          fetch-depth: 0
      - name: Claude 评审
        if: env.ANTHROPIC_API_KEY != ''
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ env.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          track_progress: true
          claude_args: |
            --max-turns 8
          prompt: |
            评审这个 PR（只读，不要改代码、不要提交、不要合并）。

            按顺序读：AGENTS.md → 改动涉及领域的 docs/（路由表在 AGENTS.md「改动前先读」）
            → PR diff。

            输出用中文，固定四段，能落地就给 文件:行：
            1. 结论：可合并 / 需修改（一句话说明理由）
            2. 违反 AGENTS.md 的项：逐条给「规则 → 证据（文件:行）→ 应怎么改」
            3. 风险点：数据/安全/跨后端（pi·dsh·acp）行为差异，没有就写「无」
            4. 门禁：这个改动该跑的验证命令（typecheck + 具体测试文件），以及 PR 里是否已体现

            不要复述 diff，不要写「建议增加注释」这类空话；没发现问题的段落直接写「无」。
