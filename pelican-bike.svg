    <circle cx="186" cy="98" r="40"/>
    <circle cx="220" cy="114" r="28"/>
    <circle cx="620" cy="172" r="24"/>
    <circle cx="652" cy="162" r="32"/>
    <circle cx="682" cy="174" r="22"/>
