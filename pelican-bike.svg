  <path d="M 470 170 C 480 196 500 204 520 198" fill="none" stroke="#e8a63f" stroke-width="2"/>
  <path d="M 462 160 C 468 182 482 192 500 190" fill="none" stroke="#e8a63f" stroke-width="2"/>

