  <circle cx="439.5" cy="138.5" r="1.8" fill="#ffffff"/>
  <circle cx="437" cy="152" r="6" fill="#ffb3a7" opacity="0.55"/>

  <!-- 上喙 -->
  <path d="M 452 136 L 566 146 Q 580 149 579 156 Q 570 158 560 155 L 452 150 Z" fill="#f5a623" stroke="#d98e1c" stroke-width="2"/>
  <line x1="492" y1="141" x2="506" y2="143" stroke="#d98e1c" stroke-width="2"/>

  <!-- 喉囊 -->
