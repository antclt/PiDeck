  <ellipse cx="516" cy="182" rx="16" ry="9" fill="#7cc4ff"/>
  <circle cx="523" cy="180" r="2" fill="#2f2f3a"/>

  <!-- 前腿 -->
  <path d="M 332 288 C 344 350 356 408 386 460" fill="none" stroke="#f08c1e" stroke-width="8" stroke-linecap="round"/>
  <ellipse cx="390" cy="462" rx="13" ry="5.5" fill="#f08c1e" transform="rotate(10 390 462)"/>
