  <path d="M 344 200 C 330 212 318 220 306 228" fill="none" stroke="#ff6b81" stroke-width="11" stroke-linecap="round"/>

  <!-- 头 -->
  <circle cx="428" cy="148" r="30" fill="#fbfaf4" stroke="#e3e0d2" stroke-width="2"/>

  <!-- 头顶羽冠 -->
  <path d="M 404 130 C 398 118 398 108 404 100" fill="none" stroke="#e3e0d2" stroke-width="3" stroke-linecap="round"/>
  <path d="M 410 124 C 408 114 410 104 416 98" fill="none" stroke="#e3e0d2" stroke-width="3" stroke-linecap="round"/>

