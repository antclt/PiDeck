  <line x1="370" y1="430" x2="388" y2="462" stroke="#3a3a46" stroke-width="6" stroke-linecap="round"/>
  <rect x="374" y="456" width="30" height="9" rx="4" fill="#3a3a46" transform="rotate(12 388 462)"/>
  <line x1="370" y1="430" x2="350" y2="446" stroke="#55555f" stroke-width="5" stroke-linecap="round"/>
  <rect x="336" y="442" width="26" height="8" rx="4" fill="#55555f" transform="rotate(-14 350 446)"/>

